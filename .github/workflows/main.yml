name: CI/CD Pipeline - Pruebas E2E, Auditoría y Despliegue

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      fail_pipeline:
        description: 'Forzar fallo intencional en pruebas Playwright (true/false)'
        required: false
        default: 'false'

jobs:
  test-and-audit:
    name: Job 1 - Pruebas Unitarias (Jest), E2E (Playwright) y Auditoria OpenObserve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacion de Dependencias
        run: npm ci

      - name: Compilar Frontend React
        run: npm run build

      - name: Ejecutar Pruebas Unitarias de Backend (Jest)
        run: npm run test:unit

      - name: Instalar Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Suite de Pruebas E2E (Playwright)
        env:
          FAIL_PIPELINE: ${{ github.event.inputs.fail_pipeline || 'false' }}
        run: npm run test:e2e

      - name: Notificar Exito de Pruebas a OpenObserve
        if: success()
        run: |
          curl -X POST "${{ secrets.OPENOBSERVE_URL }}/api/${{ secrets.OPENOBSERVE_ORG }}/${{ secrets.OPENOBSERVE_STREAM }}/_json" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.OPENOBSERVE_AUTH_TOKEN }}" \
            -d "[{
              \"event\": \"playwright_e2e_tests\",
              \"status\": \"success\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"author\": \"${{ github.actor }}\",
              \"message\": \"Suite de pruebas Unitarias (Jest) y E2E (Playwright) aprobadas exitosamente\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]"

      - name: Notificar Fallo de Pruebas a OpenObserve y Abortar Pipeline
        if: failure()
        run: |
          curl -X POST "${{ secrets.OPENOBSERVE_URL }}/api/${{ secrets.OPENOBSERVE_ORG }}/${{ secrets.OPENOBSERVE_STREAM }}/_json" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.OPENOBSERVE_AUTH_TOKEN }}" \
            -d "[{
              \"event\": \"playwright_e2e_tests\",
              \"status\": \"failure\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"author\": \"${{ github.actor }}\",
              \"message\": \"Pruebas fallidas. Pipeline abortado. Conexion SSH a EC2 bloqueada.\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]"
          exit 1

  build-and-deploy:
    name: Job 2 - Construccion Docker y Despliegue en AWS EC2
    needs: test-and-audit
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout de Codigo
        uses: actions/checkout@v4

      - name: Autenticacion en Docker Hub mediante PAT
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Publicar Imagen Docker (:latest y :commit_sha)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Despliegue por SSH en AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue de contenedor en AWS EC2..."
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            docker stop ${{ secrets.DOCKER_IMAGE_NAME }} || true
            docker rm ${{ secrets.DOCKER_IMAGE_NAME }} || true
            docker run -d \
              --name ${{ secrets.DOCKER_IMAGE_NAME }} \
              --restart always \
              -p 3000:3000 \
              -e PORT=3000 \
              -e NODE_ENV=production \
              -e OTEL_SERVICE_NAME=proyecto-parcial2-backend \
              -e OTEL_EXPORTER_OTLP_ENDPOINT="${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
              -e OPENOBSERVE_AUTH_TOKEN="${{ secrets.OPENOBSERVE_AUTH_TOKEN }}" \
              ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            echo "Despliegue completado exitosamente."

      - name: Notificar Despliegue Exitoso a OpenObserve
        if: success()
        run: |
          curl -X POST "${{ secrets.OPENOBSERVE_URL }}/api/${{ secrets.OPENOBSERVE_ORG }}/${{ secrets.OPENOBSERVE_STREAM }}/_json" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.OPENOBSERVE_AUTH_TOKEN }}" \
            -d "[{
              \"event\": \"ec2_deployment\",
              \"status\": \"success\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"author\": \"${{ github.actor }}\",
              \"image\": \"${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}\",
              \"message\": \"Contenedor actualizado y desplegado en AWS EC2 en puerto 3000\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]"
