version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: proyecto-parcial2-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_parcial2}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: proyecto-parcial2-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-proyecto_parcial2}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_proyecto_parcial2}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-proyecto-parcial2-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
      - OPENOBSERVE_AUTH_TOKEN=${OPENOBSERVE_AUTH_TOKEN}
    env_file:
      - ../.env

volumes:
  postgres_data:
